<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>无畏契约兴趣站 | 首页</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 页头:站名 + 全站导航(三个页面保持一致) -->
  <header class="site-header">
    <h1 class="site-title">无畏契约兴趣站</h1>
    <nav class="site-nav">
      <a href="index.html">首页</a>
      <a href="games.html">游戏心得</a>
      <a href="reaction.html">反应测试</a>
    </nav>
  </header>

  <!-- 每个页面只有一个 main -->
  <main>

    <!-- 第 1 节:欢迎横幅 -->
    <section class="hero">
      <img class="hero-img" src="images/card-jett.png" alt="无畏契约捷风主题玩家卡片">
      <h2>欢迎来到我的战术射击世界</h2>
      <p>
        《无畏契约》(VALORANT) 是一款 5v5 战术射击游戏,
        每一局都是枪法、技能配合与团队博弈的结合。
        这个小站记录了我整理的英雄技能、地图点位和电竞资讯。
      </p>
    </section>

    <!-- 第 2 节:三大板块入口卡片 -->
    <section class="topics">
      <h2>站内看点</h2>
      <ul class="topic-list">

        <li class="topic-card">
          <img class="topic-img" src="images/jett.png" alt="决斗者英雄捷风立绘">
          <h3>技能介绍</h3>
          <p>捷风、霓虹等英雄的技能机制与实战用法。</p>
          <div class="icon-strip">
            <img src="images/jett-c.png" alt="捷风 C 技能图标">
            <img src="images/jett-q.png" alt="捷风 Q 技能图标">
            <img src="images/jett-e.png" alt="捷风 E 技能图标">
            <img src="images/jett-x.png" alt="捷风 X 终极技能图标">
          </div>
          <a href="games.html">查看详情 →</a>
        </li>

        <li class="topic-card">
          <img class="topic-img" src="images/ascent.png" alt="亚海悬城地图原画">
          <h3>地图介绍</h3>
          <p>亚海悬城、隐世修所的点位与转点思路。</p>
          <a href="games.html">查看详情 →</a>
        </li>

        <li class="topic-card">
          <img class="topic-img" src="images/rank-radiant.png" alt="辐能战魂段位徽章">
          <h3>电竞模块</h3>
          <p>国内联赛与全球赛事的看点追踪。</p>
          <div class="icon-strip">
            <img src="images/rank-gold.png" alt="黄金段位徽章">
            <img src="images/rank-diamond.png" alt="钻石段位徽章">
            <img src="images/rank-radiant.png" alt="辐能战魂段位徽章">
          </div>
          <a href="games.html">查看详情 →</a>
        </li>

      </ul>
    </section>

  </main>

  <!-- 页脚:三个页面都放 -->
  <footer class="site-footer">
    <p>© 2026 无畏契约兴趣站 · 由 HTML/CSS/JS 手工搭建</p>
  </footer>

</body>
</html>
